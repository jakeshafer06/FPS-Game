<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name — Portfolio</title>
<meta name="description" content="Independent designer & creative developer.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #050505;
    --ice: #cde7e9;
    --pale: #e6e6e6;
    --gray: #bcbcbc;
    --dim: rgba(205, 231, 233, .45);
    --green: #11ff00;
    --blue: #0000ff;
    --pad: 40px;
    --ease: cubic-bezier(.25, 1, .5, 1);
    --ease-menu: cubic-bezier(.22, 1, .36, 1);
  }
  @media (max-width: 767px) { :root { --pad: 20px; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: #fff; overscroll-behavior: none; }
  body {
    font-family: 'Doto', ui-monospace, monospace; font-weight: 700;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
  ol, ul { list-style: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .skip:focus { position: fixed; z-index: 200; top: 16px; left: 16px; width: auto; height: auto; clip-path: none; background: #fff; color: #000; padding: 8px 12px; }
  :focus-visible { outline: 2px solid #ff0; outline-offset: 3px; }

  /* ---------- Stage ---------- */
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  body.nogl #scene { display: none; }
  body.nogl { background: radial-gradient(ellipse at 50% 40%, #12191b 0%, #050505 60%); }
  #scroll { pointer-events: none; }
  #labels { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: auto; cursor: pointer;
    font-weight: 900; font-size: 24px; letter-spacing: -.02em; text-transform: uppercase; color: #fff;
    -webkit-text-stroke: .5px currentColor; text-shadow: 0 1px 6px rgba(0,0,0,.5);
    transform-origin: 0 100%; will-change: transform, opacity; opacity: 0; visibility: hidden;
  }
  .lbl small { display: block; font-size: 10px; letter-spacing: .14em; -webkit-text-stroke: 0; color: var(--dim); margin-bottom: 3px; }

  .fade { opacity: 0; visibility: hidden; transition: opacity .15s ease-out, visibility .15s; }
  .fade.on { opacity: 1; visibility: visible; transition-duration: .5s; transition-timing-function: var(--ease); }
  .ov { position: fixed; z-index: 10; pointer-events: none; text-transform: uppercase; }
  .ov a, .ov button { pointer-events: auto; }
  .fade:not(.on) a, .fade:not(.on) button { pointer-events: none; }
  .glow-crt { text-shadow: 0 0 3.3px rgba(255,255,255,.81); }
  .wrap { width: 100%; max-width: 2056px; margin-inline: auto; padding-inline: var(--pad); }

  /* ---------- Loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 100; background: #000; color: var(--ice);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .3s ease-in, visibility .3s;
  }
  #loader.done { opacity: 0; visibility: hidden; }
  #loader .t { font-weight: 900; font-size: 36px; line-height: 1.4; text-transform: uppercase; }
  .pill {
    width: 149px; height: 15px; margin-top: -4px; border: 1px solid currentColor; border-radius: 99px;
    overflow: hidden; display: flex; align-items: center; filter: drop-shadow(0 0 1.5px rgba(255,255,255,.81));
  }
  .pill i { width: 11px; height: 11px; flex: none; border-radius: 50%; background: currentColor; animation: dotr 1.4s linear infinite; }
  @keyframes dotr { from { transform: translateX(-11px); } to { transform: translateX(147px); } }
  #loader .pct { margin-top: 14px; font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--dim); }

  /* ---------- Header ---------- */
  header {
    position: fixed; top: 25px; left: 0; right: 0; z-index: 50; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: opacity 1s ease-out .5s;
  }
  body.ready header { opacity: 1; pointer-events: auto; }
  header .wrap { display: flex; justify-content: space-between; align-items: center; }
  .diff { mix-blend-mode: difference; }
  body.menu-open .diff { mix-blend-mode: normal; }
  .brand { font-weight: 900; font-size: 16px; line-height: .72; white-space: nowrap; transition: opacity .5s; }
  .brand:hover { opacity: .7; }
  .hr { display: flex; align-items: center; gap: 25px; font-size: 14px; font-weight: 700; line-height: .72; }
  .talk { display: flex; align-items: center; gap: 3px; }
  .led { width: 3px; height: 3px; background: var(--green); animation: blinkslow 2.4s ease-in-out infinite; }
  body.menu-open .talk, body.menu-open .cue { visibility: hidden; }
  @keyframes blinkslow { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
  .menu { position: relative; }
  .menu-btn { display: flex; align-items: center; gap: 3px; white-space: nowrap; position: relative; z-index: 2; }
  .menu-btn svg { height: 10px; }
  .menu-btn .x { display: none; }
  body.menu-open .menu-btn .m, body.menu-open .menu-btn svg { display: none; }
  body.menu-open .menu-btn .x { display: inline; }
  #menuList {
    position: absolute; right: 0; top: 100%; width: 212px; padding-top: 30px;
    opacity: 0; visibility: hidden; transition: opacity .35s var(--ease-menu), visibility .35s;
  }
  body.menu-open #menuList { opacity: 1; visibility: visible; }
  #menuList a.mi { display: flex; justify-content: space-between; padding: 8px 5px; font-size: 16px; font-weight: 700; line-height: 1; color: #fff; }
  #menuList a.mi.cur { background: #fff; color: #000; }
  #menuList a.mi:hover { background: var(--blue) !important; color: #fff !important; }
  .mlinks { margin-top: 30px; padding-inline: 5px; display: flex; flex-direction: column; gap: 9px; font-size: 14px; font-weight: 600; text-transform: none; line-height: 1.2; }
  .gt { opacity: .5; }
  #backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.8); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease-menu); }
  body.menu-open #backdrop { opacity: 1; pointer-events: auto; }
  .legal {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 16px;
    font-size: min(2.5vw, 11px); font-weight: 700; line-height: 1.1; letter-spacing: -.02em; color: rgba(255,255,255,.5); text-transform: uppercase;
  }
  .legal :last-child { justify-self: end; }
  .menu-legal { position: fixed; z-index: 45; left: 0; right: 0; bottom: calc(25px + env(safe-area-inset-bottom, 0px)); opacity: 0; visibility: hidden; transition: opacity .35s var(--ease-menu), visibility .35s; }
  body.menu-open .menu-legal { opacity: 1; visibility: visible; }
  @media (max-width: 1023px) {
    header { top: 20px; }
    .hr { gap: 19px; font-size: 15px; }
    .brand { font-size: 15px; font-weight: 700; }
    #menuList { position: fixed; left: var(--pad); right: var(--pad); top: calc(48px + env(safe-area-inset-top, 0px)); width: auto; }
    #menuList a.mi { padding: 8px 13px; }
    .mlinks { align-items: flex-end; padding-inline: 13px; }
  }
  @media (max-width: 767px) { .legal { grid-template-columns: auto 1fr auto; gap: 8px; } .legal > :nth-child(2) { text-align: center; } }

  /* ---------- HUD (desktop) ---------- */
  .hud { display: none; }
  @media (min-width: 1024px) and (min-aspect-ratio: 3/2) { .hud { display: block; } }
  .hudbar {
    position: fixed; z-index: 8; bottom: 25px; font-size: 10px; font-weight: 700; letter-spacing: .14em; line-height: 1.5;
    color: var(--dim); text-transform: uppercase; pointer-events: none; white-space: pre; font-variant-numeric: tabular-nums;
    transition: opacity .5s;
  }
  #hudL { left: var(--pad); } #hudR { right: var(--pad); text-align: right; }
  #hudR b { color: var(--green); font-weight: 700; }
  body.at-end .hudbar { opacity: 0; }
  #stamp {
    position: fixed; z-index: 8; right: calc(var(--pad) + 20px); bottom: 74px; white-space: pre; text-align: right; pointer-events: none;
    font-size: 22px; font-weight: 700; letter-spacing: .06em; line-height: 1.2; color: #f4f1e6; opacity: .85;
    text-shadow: 2px 2px 0 rgba(0,0,0,.6), 0 0 6px rgba(255,250,230,.35), 1px 0 0 rgba(255,60,90,.4), -1px 0 0 rgba(60,170,255,.4);
    transition: opacity .5s;
  }
  body.at-end #stamp { opacity: 0; }
  #rail { position: fixed; z-index: 11; right: var(--pad); top: 50%; transform: translateY(-50%); display: none; flex-direction: column; gap: 10px; align-items: flex-end; }
  @media (min-width: 1024px) and (min-aspect-ratio: 3/2) { #rail { display: flex; } }
  #rail button { display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  #rail button span { opacity: 0; transform: translateX(6px); transition: opacity .3s var(--ease), transform .3s var(--ease); }
  #rail button i { display: block; width: 10px; height: 1px; background: currentColor; transition: width .35s var(--ease-menu); }
  #rail button:hover span, #rail button[aria-current] span { opacity: 1; transform: none; }
  #rail button[aria-current] { color: #fff; }
  #rail button[aria-current] i { width: 26px; }
  body.menu-open #rail { opacity: 0; pointer-events: none; }

  /* ---------- Scene tabs + channel OSD ---------- */
  #rail { display: none !important; }
  #tabs {
    position: fixed; z-index: 51; top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; opacity: 0; pointer-events: none; transition: opacity 1s ease-out .6s;
  }
  body.ready #tabs { opacity: 1; pointer-events: auto; }
  body.menu-open #tabs { opacity: 0; pointer-events: none; transition-delay: 0s; }
  #tabs button {
    display: flex; gap: 6px; align-items: baseline; padding: 6px 10px 5px; font-size: 12px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.22);
    background: rgba(5,8,12,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: color .2s, background .2s, border-color .2s;
  }
  #tabs button small { font-size: 10px; opacity: .6; }
  #tabs button:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
  #tabs button[aria-current] { background: #fff; border-color: #fff; color: #000; }
  #chosd {
    position: fixed; z-index: 12; left: var(--pad); top: 70px; pointer-events: none;
    font-size: 30px; font-weight: 900; letter-spacing: .02em; color: #57ff4a; text-transform: uppercase;
    text-shadow: 0 0 6px rgba(87,255,74,.7), 2px 0 0 rgba(255,0,80,.35), -2px 0 0 rgba(0,160,255,.35);
    opacity: 0; transition: opacity .25s steps(3);
  }
  #chosd b { font-weight: 900; margin-right: 10px; }
  #chosd.on { opacity: 1; }
  @media (max-width: 1023px) {
    #tabs { top: calc(50px + env(safe-area-inset-top, 0px)); left: var(--pad); right: var(--pad); transform: none; }
    #tabs button { flex: 1; justify-content: center; padding: 6px 0 5px; font-size: 11px; }
    #tabs button small { display: none; }
    #chosd { top: calc(92px + env(safe-area-inset-top, 0px)); font-size: 22px; }
  }

  /* ---------- Cursor ---------- */
  html.cur-on, html.cur-on * { cursor: none !important; }
  #cur { position: fixed; left: 0; top: 0; z-index: 300; pointer-events: none; mix-blend-mode: difference; display: none; }
  html.cur-on #cur { display: block; opacity: 0; transition: opacity .3s; }
  html.cur-on #cur.live { opacity: 1; }
  #cur .r { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 1px solid #fff; border-radius: 50%; transition: transform .35s var(--ease), border-radius .35s; }
  #cur .d { position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: #fff; }
  #cur .c { position: absolute; left: 20px; top: 12px; font-size: 9px; font-weight: 700; letter-spacing: .12em; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cur.hot .r { transform: scale(1.6); border-radius: 0; }

  /* ---------- Intro ---------- */
  #intro { inset: 0; display: flex; align-items: center; padding-top: 18px; }
  #intro .wrap { display: flex; justify-content: space-between; align-items: center; }
  .who { width: 212px; white-space: nowrap; color: var(--pale); text-shadow: 0 0 6px rgba(230,230,230,.7); }
  .who .n { font-weight: 900; font-size: 32px; line-height: .72; }
  .who .m { margin-top: 4px; padding-right: 20px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; line-height: .9; }
  .tag { width: 235px; text-align: justify; font-size: 14px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; text-shadow: 0 0 4px rgba(255,255,255,.7), 0 0 14px #000; }
  .cue { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 12px; font-weight: 800; letter-spacing: .12em; color: rgba(255,255,255,.6); }
  .cue b { animation: blink .8s step-end infinite; font-weight: 800; }
  @keyframes blink { 0%,49.9% { opacity: 1; } 50%,100% { opacity: 0; } }
  @media (max-width: 1023px) {
    #intro { align-items: flex-end; padding: 0 0 calc(56px + env(safe-area-inset-bottom, 0px)); }
    .who { display: none; }
    .tag { width: auto; text-align: left; font-size: min(7vw, 48px); font-weight: 700; line-height: 1.05; }
    .cue { display: none; }
  }

  /* ---------- Selected work nav ---------- */
  #work { left: 0; right: 0; top: 49.2%; display: none; }
  @media (min-width: 1024px) and (min-aspect-ratio: 3/2) { #work { display: block; } }
  #work .t { font-weight: 900; font-size: 28px; line-height: .72; letter-spacing: -.02em; margin-bottom: 9px; color: var(--pale); text-shadow: 0 0 12px #000; }
  #work .lst { position: relative; font-size: 14px; font-weight: 800; letter-spacing: -.04em; line-height: 1.25; text-shadow: 0 0 8px #000; }
  #work .dot { position: absolute; left: 0; top: 0; height: 1.25em; display: flex; align-items: center; transform: translateY(calc(var(--i, 0) * 100%)); transition: transform .35s var(--ease-menu); }
  #work .dot i { width: 4px; height: 4px; border-radius: 50%; background: var(--pale); }
  #work button { display: block; color: rgba(230,230,230,.55); transition: translate .35s var(--ease-menu), color .35s var(--ease-menu); }
  #work button:hover { color: var(--pale); }
  #work button[aria-current] { color: var(--pale); translate: 9px 0; }

  /* ---------- Project panels ---------- */
  .panel {
    left: 0; right: 0; top: 71.5%; display: flex; justify-content: center; column-gap: 36px; color: #fff; white-space: nowrap;
    text-shadow: 0 0 4px #000, 0 0 12px #000, 0 0 24px rgba(0,0,0,.9), 0 2px 4px #000;
  }
  .pc1 { width: 216px; flex: none; }
  .ph { margin-bottom: 12px; }
  .plab { font-size: 14px; line-height: .95; margin-bottom: 7px; }
  .ph .plab { margin: 0; }
  .pcount { display: none; font-size: 14px; letter-spacing: .12em; color: var(--gray); }
  .pcount b { color: #fff; font-weight: 700; }
  .ptitle { display: block; font-weight: 900; font-size: 23px; line-height: .95; letter-spacing: -.03em; white-space: normal; text-wrap: balance; }
  .ptitle:hover { color: var(--ice); }
  .pinfo { display: contents; }
  .pc2 { width: 281px; flex: none; }
  .pc2 p { white-space: normal; font-size: 14px; font-weight: 700; line-height: 1.1; max-width: 267px; }
  .pc3 { width: 106px; flex: none; }
  .roles { display: flex; flex-direction: column; font-size: 14px; font-weight: 700; line-height: 1.1; }
  .thumbs { width: 286px; flex: none; margin-top: 9px; display: flex; gap: 9px; }
  .thumbs button { width: 50px; height: 30px; border: 1px solid #fff; overflow: hidden; opacity: .5; transition: opacity .15s; }
  .thumbs button:hover { opacity: .75; }
  .thumbs button[aria-pressed="true"] { opacity: 1; }
  .thumbs canvas, .thumbs img { width: 100%; height: 100%; display: block; object-fit: cover; }
  @media (max-width: 1023px) {
    .panel {
      top: 0; bottom: 0; flex-direction: column; white-space: normal;
      padding: calc(100px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left));
    }
    .panel::before, .panel::after { content: ""; position: absolute; left: 0; right: 0; z-index: -1; }
    .panel::before { top: 0; height: 40%; background: linear-gradient(to bottom, rgba(5,5,5,.85) 35%, transparent); }
    .panel::after { bottom: 0; height: 60%; background: linear-gradient(to top, rgba(5,5,5,.85) 40%, transparent); }
    .pc1, .pc2, .pc3 { width: auto; }
    .ph { display: flex; justify-content: space-between; align-items: baseline; }
    .plab { color: var(--gray); letter-spacing: .12em; margin-bottom: 8px; }
    .pcount { display: inline; }
    .ptitle { font-size: 30px; line-height: 1; }
    .pinfo { display: flex; flex-direction: column; gap: 24px; margin-top: auto; }
    .pc2 p { max-width: none; line-height: 1.2; }
    .roles { flex-direction: row; flex-wrap: wrap; gap: 4px 16px; }
    .thumbs { display: none; }
  }

  /* ---------- About ---------- */
  #aboutBg { inset: 0 auto 0 0; width: 78.8%; background: linear-gradient(to left, transparent, rgba(0,0,0,.7)); z-index: 9; }
  .ab { left: 72px; bottom: 200px; display: flex; flex-direction: column; gap: 16px; text-shadow: 0 1px 8px rgba(0,0,0,.6); }
  .ab .rail { position: absolute; top: 10px; bottom: 9px; left: -32px; display: flex; flex-direction: column; align-items: center; }
  .ab .rail svg.tri { width: 6px; height: 5px; }
  .ab .rail svg.tri.up { transform: rotate(180deg); }
  .ab .rail svg.ln { width: 1px; flex: 1; }
  .ab .body { display: flex; flex-direction: column; gap: 13px; }
  .ab h2 { font-size: 16px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
  .ab .lead { max-width: 42ch; font-size: 16px; line-height: 1.4; }
  .ab .txt { max-width: 42ch; font-size: 16px; line-height: 1.2; letter-spacing: -.02em; }
  .ab .more { width: fit-content; font-size: 16px; line-height: 1.1; letter-spacing: -.02em; }
  .ab .more:hover { color: var(--ice); }
  @media (max-width: 767px) { .ab { left: 52px; right: 20px; } .ab .lead, .ab .txt { max-width: 31ch; } }

  /* ---------- Contact ---------- */
  #contact { inset: 0; display: grid; place-items: center; padding: 0 20px 20px; }
  .cbox { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .vig {
    position: absolute; left: 50%; top: 50%; width: 992px; height: 520px; margin-top: 67px; transform: translate(-50%, -50%);
    border-radius: 50%; background: radial-gradient(ellipse farthest-side at center, rgba(0,0,0,.78) 0%, rgba(0,0,0,.7) 40%, rgba(0,0,0,.3) 72%, transparent 100%);
    pointer-events: none; max-width: 200vw;
  }
  .cta { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 15px 25px; min-width: 463px; }
  .cta .big { font-weight: 900; font-size: 40px; line-height: 1.06; letter-spacing: -.02em; text-shadow: 0 0 10px #000; }
  .cta .small { max-width: 225px; font-size: 14px; font-weight: 800; line-height: 1.3; letter-spacing: -.02em; }
  .plus { position: absolute; width: 24px; height: 24px; }
  .plus.tl { top: -12px; left: -12px; } .plus.tr { top: -12px; right: -12px; }
  .plus.bl { bottom: -12px; left: -12px; } .plus.br { bottom: -12px; right: -12px; }
  .arr { position: absolute; width: 26px; height: 14px; color: #fff; opacity: 0; }
  .arr.l { top: 72px; left: -4px; transform: translate(-50%, -50%); }
  .arr.r { top: 71px; right: -2px; transform: translate(50%, -50%) rotate(180deg); }
  .arr.b { top: 176px; left: 50%; margin-left: -4px; transform: translate(-50%, -50%) rotate(-90deg); }
  @media (hover: hover) {
    .cta:hover .arr.l { animation: blink .4s step-end .3s infinite; }
    .cta:hover .arr.r { animation: blink .4s step-end .1s infinite; }
    .cta:hover .arr.b { animation: blink .4s step-end .2s infinite; }
  }
  .cta:focus-visible .arr { opacity: 1; }
  .clinks { position: absolute; top: 100%; margin-top: 90px; display: flex; flex-wrap: wrap; justify-content: center; gap: 9px 23px; font-size: 14px; font-weight: 900; line-height: 1.1; letter-spacing: -.02em; }
  .clinks .gt { color: rgba(255,255,255,.5); opacity: 1; }
  .clinks a:hover { color: var(--ice); }
  .cfoot { position: fixed; left: 0; right: 0; bottom: calc(25px + env(safe-area-inset-bottom, 0px)); opacity: .9; }
  @media (max-width: 767px) {
    .cta { min-width: 0; }
    .cta .big { font-size: 30px; }
    .clinks { margin-top: 60px; }
    .cfoot { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (max-height: 416px) { .cfoot { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    .pill i { animation: none; margin-left: 11px; }
    .led, .cue b { animation: none; }
    .cta:hover .arr, .cta:focus-visible .arr { animation: none !important; opacity: 1; }

<script>

$('.menu-legal').innerHTML = legal; $('.cfoot').innerHTML = legal;

const ARROW = ['.........#...', '..........#..', '...........#.', '#############', '...........#.', '..........#..', '.........#...'];
const arrowSVG = '<svg viewBox="0 0 26 14" fill="currentColor" style="transform:scaleX(-1)">' + ARROW.flatMap((row, r) =>
  [...row].map((ch, c) => ch === '#' ? `<circle cx="${c * 2 + 1}" cy="${r * 2 + 1}" r=".95"/>` : '')).join('') + '</svg>';
$$('.arr').forEach(el => el.innerHTML = arrowSVG);
$$('.plus').forEach(el => el.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 23.5V0M0 11.5H24" stroke="#fff" stroke-opacity=".5"/></svg>');
$('#clinks').innerHTML = CONFIG.social.map(([n, u]) =>
  `<li><a href="${esc(u)}"${u.startsWith('http') ? ' target="_blank" rel="noopener noreferrer"' : ''}><span class="gt" aria-hidden="true">&gt; </span><span data-s>${esc(n)}</span></a></li>`).join('');

/* ---------- scroll timeline (units = viewport heights) ---------- */
const SEG = {}; let U = 0;
SEG.intro = { s: U, len: 1.4 }; U += 1.4;
SEG.projects = CONFIG.projects.map(() => { const s = { s: U, len: 2 }; U += 2; return s; });
SEG.about = CONFIG.about.map(() => { const s = { s: U, len: 1.5 }; U += 1.5; return s; });
SEG.contact = { s: U, len: 1.6 }; U += 1.6;
const MAXU = U;
$('#scroll').style.height = `calc(${MAXU} * 100vh + 100vh)`;
const goU = u => window.scrollTo({ top: u * innerHeight, behavior: reduce ? 'auto' : 'smooth' });
const projU = i => SEG.projects[i].s + 1;
const TARGETS = { home: 0, work: projU(0), about: SEG.about[0].s + .75, contact: MAXU };

/* ---------- menu ---------- */
$('#menuList').innerHTML = [['home', 'home'], ['work', 'work'], ['about', 'about'], ['contact', 'contact']].map(([l, k], i) =>
  `<li><a href="#" class="mi${i === 0 ? ' cur' : ''}" data-go="${k}"><span>${l}</span><span aria-hidden="true">${pad(i + 1)}</span></a></li>`).join('') +
  `<li class="mlinks">` + [['Email', 'mailto:' + CONFIG.email], ...CONFIG.social.filter(s => !s[1].startsWith('mailto'))]
    .map(([n, u]) => `<a href="${esc(u)}"><span class="gt" aria-hidden="true">&gt; </span><span data-s>${esc(n[0].toUpperCase() + n.slice(1))}</span></a>`).join('') + `</li>`;
const setMenu = open => { document.body.classList.toggle('menu-open', open); $('#menuBtn').setAttribute('aria-expanded', open); };
$('#menuBtn').addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
$('#backdrop').addEventListener('click', () => setMenu(false));
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { setMenu(false); $('#menuBtn').focus(); } });
document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (!a) return; e.preventDefault(); setMenu(false); goU(TARGETS[a.dataset.go]); });

/* ---------- section rail ---------- */
const RAIL = [['00', 'intro', 0], ...CONFIG.projects.map((p, i) => [pad(i + 1), p.title, projU(i)]), ['//', 'about', TARGETS.about], ['@', 'contact', MAXU]];
$('#rail').innerHTML = RAIL.map(([n, l, u], i) => `<button data-u="${u}" data-r="${i}"><span>${n} ${esc(l)}</span><i></i></button>`).join('');
$$('#rail button').forEach(b => b.addEventListener('click', () => goU(+b.dataset.u)));

/* ---------- scene tabs ---------- */
const TABS = [['01', 'intro', 0], ['02', 'work', projU(0)], ['03', 'about', TARGETS.about], ['04', 'contact', MAXU]];
$('#tabs').innerHTML = TABS.map(([n, l, u]) => `<button data-u="${u}"><small>${n}</small><span data-s>${l}</span></button>`).join('');
$$('#tabs button').forEach(b => b.addEventListener('click', () => goU(+b.dataset.u)));

/* ---------- work list, labels, panels ---------- */
$('#workList').innerHTML = CONFIG.projects.map((p, i) => `<li><button data-i="${i}">[${pad(i + 1)}] ${esc(p.title)}</button></li>`).join('');
$$('#workList button').forEach(b => b.addEventListener('click', () => goU(projU(+b.dataset.i))));
$('#labels').innerHTML = CONFIG.projects.map((p, i) =>
  `<button class="lbl" data-i="${i}" aria-label="Open project ${esc(p.title)}"><small>[${pad(i + 1)}]</small>${esc(p.title)}</button>`).join('');
const labelEls = $$('.lbl');
labelEls.forEach(b => b.addEventListener('click', () => goU(projU(+b.dataset.i))));

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
function patternVal(seed, u, v, t) {
  const a = 1 + (seed % 5) * .5, ph = seed * 1.7 + t;
  switch (seed % 5) {
    case 0: return .5 + .5 * Math.sin(Math.hypot(u, v * .62) * 22 * a - ph * 2);
    case 1: return .5 + .5 * Math.sin(u * 12 * a + Math.sin(v * 8 + ph) * 2.2);
    case 2: return 1.05 - Math.hypot(u - .18 * Math.sin(ph), (v - .1 * Math.cos(ph * .7)) * .62) * 2.4;
    case 3: return .5 + .5 * Math.sin(u * 9 + ph) * Math.cos(v * 11 - ph);
    default: return .5 + .5 * Math.sin((u + v) * 14 + ph) * Math.sin((u - v) * 9 - ph * .6);
  }
}
CONFIG.projects.forEach((p, i) => {
  p.variant = 0;
  const nv = p.images && p.images.length ? p.images.length : 3;
  const el = document.createElement('section');
  el.className = 'ov fade panel'; el.setAttribute('aria-label', 'Project ' + p.title);
  el.innerHTML = `
    <div class="pc1">
      <div class="ph"><span class="plab">Project</span><span class="pcount"><b>${pad(i + 1)}</b> / ${pad(P)}</span></div>
      <a class="ptitle" href="${esc(p.url)}"${p.url.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}><span data-s>${esc(p.title)}</span></a>
    </div>
    <div class="pinfo">
      <div class="pc2"><div class="plab">Info</div><p>${esc(p.desc)}</p></div>
      <div class="pc3"><div class="plab">Role</div><div class="roles">${p.roles.map(r => `<span>${esc(r)}</span>`).join('')}</div></div>
    </div>
    <div class="thumbs">${Array.from({ length: nv }, (_, k) =>
      `<button aria-label="${esc(p.title)} — image ${k + 1}" aria-pressed="${k === 0}" data-k="${k}">${
        p.images && p.images[k] ? `<img src="${esc(p.images[k])}" alt="">` : `<canvas width="50" height="30"></canvas>`}</button>`).join('')}</div>`;
  $('#panels').appendChild(el);
  p.panel = el;
  $$('.thumbs button', el).forEach(b => b.addEventListener('click', () => {
    p.variant = +b.dataset.k;
    $$('.thumbs button', el).forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
  $$('.thumbs canvas', el).forEach((c, k) => {
    const x = c.getContext('2d'); x.fillStyle = '#050505'; x.fillRect(0, 0, 50, 30); x.fillStyle = '#cde7e9';
    for (let y = 0; y < 30; y += 2) for (let xx = 0; xx < 50; xx += 2)
      if (patternVal(i * 3 + k * 7, xx / 50 - .5, y / 30 - .5, 0) > BAYER[((y / 2) % 4) * 4 + (xx / 2) % 4]) x.fillRect(xx, y, 1.4, 1.4);
  });
});

$('#abouts').innerHTML = CONFIG.about.map(a => `
  <section class="ov fade ab" aria-label="${esc(a.title)}">
    <div class="rail" aria-hidden="true">
      <svg class="tri" viewBox="0 0 5.77 5" fill="currentColor"><path d="M3.39 5 5.77 0H0l2.39 5z"/></svg>
      <svg class="ln"><line x1=".5" y1="0" x2=".5" y2="100%" stroke="currentColor" stroke-dasharray="2 2"/></svg>
      <svg class="tri up" viewBox="0 0 5.77 5" fill="currentColor"><path d="M3.39 5 5.77 0H0l2.39 5z"/></svg>
    </div>
    <div class="body">
      <h2>${esc(a.title)}</h2>
      ${a.lead ? `<p class="lead">${esc(a.lead)}</p>` : ''}
      <p class="txt">${esc(a.text)}</p>
    </div>
    <a class="more" href="${esc(a.link || '#')}"><span aria-hidden="true">&gt;</span> <span data-s>learn more</span></a>
  </section>`).join('');
const aboutEls = $$('.ab');

/* ---------- text scramble ---------- */
const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>';
function scramble(el) {
  if (reduce) return;
  const orig = el.dataset.orig ?? (el.dataset.orig = el.textContent);
  const n = orig.length, speed = Math.max(1, n / 18);
  let f = 0; cancelAnimationFrame(el._raf);
  const step = () => {
    el.textContent = [...orig].map((ch, i) => ch === ' ' || i < f / 2 ? ch : GLYPHS[Math.random() * GLYPHS.length | 0]).join('');
    f += speed;
    if (f < n * 2) el._raf = requestAnimationFrame(step); else el.textContent = orig;
  };
  step();
}
document.addEventListener('mouseover', e => {
  const t = e.target.closest('a, button'); if (!t || t.contains(e.relatedTarget)) return;
  $$('[data-s]', t).forEach(s => { if (s.offsetParent !== null) scramble(s); });
});

/* ---------- overlay state ---------- */
const state = {};
function setOn(key, el, on) {
  if (state[key] === on) return; state[key] = on;
  el.classList.toggle('on', on);
  if (on) $$('[data-s]', el).forEach(scramble);
}
function updateOverlays(u) {
  setOn('intro', $('#intro'), u < 1.15);
  setOn('cue', $('#cue'), u < .3);
  const p0 = SEG.projects[0].s, pN = SEG.projects[P - 1].s + SEG.projects[P - 1].len;
  setOn('work', $('#work'), u > p0 + .35 && u < pN - .3);
  const active = clamp(Math.floor((u - p0) / 2), 0, P - 1);
  if (state.active !== active) {
    state.active = active;
    $('#work .lst').style.setProperty('--i', active);
    $$('#workList button').forEach((b, i) => i === active ? b.setAttribute('aria-current', 'location') : b.removeAttribute('aria-current'));
  }
  SEG.projects.forEach((s, i) => setOn('p' + i, CONFIG.projects[i].panel, u > s.s + .55 && u < s.s + 1.5));
  let anyAbout = false;
  SEG.about.forEach((s, i) => { const on = u > s.s + .3 && u < s.s + 1.2; anyAbout ||= on; setOn('a' + i, aboutEls[i], on); });
  setOn('aboutBg', $('#aboutBg'), anyAbout);
  const atEnd = u > SEG.contact.s + .45;
  setOn('contact', $('#contact'), atEnd);
  document.body.classList.toggle('at-end', atEnd);
  const cur = u < p0 + .2 ? 0 : u < pN ? 1 : u < SEG.contact.s + .3 ? 2 : 3;
  if (state.cur !== cur) { state.cur = cur; $$('#menuList a.mi').forEach((a, i) => a.classList.toggle('cur', i === cur)); }
  const rail = u < p0 + .3 ? 0 : u < pN ? 1 + active : u < SEG.contact.s + .3 ? P + 1 : P + 2;
  const tab = u < p0 ? 0 : u < SEG.about[0].s ? 1 : u < SEG.contact.s ? 2 : 3;
  if (state.tab !== tab) { state.tab = tab; $$('#tabs button').forEach((b, i) => i === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current')); }
  if (state.rail !== rail) { state.rail = rail; $$('#rail button').forEach((b, i) => i === rail ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current')); }
}

/* ---------- smoothed scroll value shared with the 3D module ---------- */
let us = 0, lastT = performance.now();
function uiLoop(now = performance.now()) {
  requestAnimationFrame(uiLoop);
  const dt = Math.min(.25, (now - lastT) / 1000); lastT = now;
  const target = scrollY / innerHeight;
  us += (target - us) * (reduce ? 1 : 1 - Math.exp(-dt * 4.5)); if (Math.abs(target - us) < 1e-4) us = target;
  updateOverlays(us);
}

/* ---------- custom cursor (fine pointers only) ---------- */
if (matchMedia('(hover: hover) and (pointer: fine)').matches && !reduce) {
  document.documentElement.classList.add('cur-on');
  const cur = $('#cur'), ring = $('.r', cur), coord = $('.c', cur);
  let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y;
  addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY;
    cur.classList.add('live');
    cur.classList.toggle('hot', !!e.target.closest('a, button'));
  });
  (function cl() {
    requestAnimationFrame(cl);
    rx += (x - rx) * .18; ry += (y - ry) * .18;
    $('.d', cur).style.transform = `translate(${x}px,${y}px)`;
    ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
    coord.style.transform = `translate(${x}px,${y}px)`;
    coord.textContent = `${String(Math.round(x)).padStart(4, '0')} ${String(Math.round(y)).padStart(4, '0')}`;
  })();
}

/* ---------- loader ---------- */
let sceneReadyResolve; const sceneReady = new Promise(r => sceneReadyResolve = r);
window.APP = { CONFIG, SEG, MAXU, P, goU, projU, labelEls, reduce, patternVal, getU: () => us, sceneReady: () => sceneReadyResolve() };
(() => {
  let p = 0; const el = $('#pct');
  const iv = setInterval(() => { p = Math.min(96, p + Math.random() * 7); el.textContent = String(Math.floor(p)).padStart(3, '0') + '%'; }, 60);
  const minWait = new Promise(r => setTimeout(r, reduce ? 0 : 1400));
  const timeout = new Promise(r => setTimeout(r, 6000));
  Promise.all([document.fonts ? document.fonts.ready : null, minWait, Promise.race([sceneReady, timeout])]).then(() => {
    clearInterval(iv); el.textContent = '100%';
    setTimeout(() => {
      $('#loader').classList.add('done');
      document.body.classList.add('ready');
      $$('header [data-s]').forEach(scramble);
    }, 200);
  });
  uiLoop();
})();
</script>

<script type="module">
/* =========================================================
   3D — four scenes ("channels"), switched through VHS static:
   01 Canyon · 02 Archive · 03 Rooftops · 04 Signal
   ========================================================= */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const A = window.APP;
const C = A.CONFIG, P = A.P, reduce = A.reduce, SEG = A.SEG;

const canvas = document.getElementById('scene');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.body.classList.add('nogl'); A.sceneReady(); throw e;
}
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(0x000000, 1);

const small = innerWidth < 768;
const camera = new THREE.PerspectiveCamera(small ? 70 : 58, innerWidth / innerHeight, 1, 14000);
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), .04).texture;

/* ---------- procedural concrete atlas (tiles / panels / grime / streaks / cracks) ---------- */
function concreteTexture() {
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  let seed = 98765; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  x.fillStyle = 'rgb(140,140,140)'; x.fillRect(0, 0, S, S);
  for (const [cells, alpha] of [[8, .35], [24, .3], [64, .22], [180, .18], [512, .14]]) {
    const n = document.createElement('canvas'); n.width = n.height = cells;
    const nx = n.getContext('2d'), id = nx.createImageData(cells, cells);
    for (let i = 0; i < cells * cells; i++) { const v = r() * 255; id.data.set([v, v, v, 255], i * 4); }
    nx.putImageData(id, 0, 0);
    x.globalAlpha = alpha; x.imageSmoothingEnabled = true; x.drawImage(n, 0, 0, S, S);
  }

    vertexShader: `varying vec2 vUv; varying float vF;
      void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position,1.);
        vec3 n = normalize(mat3(modelMatrix) * vec3(0.,0.,1.)), V = normalize(cameraPosition - w.xyz);
        vF = smoothstep(.05, .5, abs(dot(n, V))); gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform float uTime, uA; uniform vec3 uC; varying vec2 vUv; varying float vF;
      float h(float x){ return fract(sin(x * 127.1) * 43758.5); }
      float n1(float x){ float i = floor(x), f = fract(x); return mix(h(i), h(i + 1.), f * f * (3. - 2. * f)); }
      void main(){
        float streak = .45 + .55 * n1(vUv.x * 22. + uTime * .15) * n1(vUv.x * 7. - uTime * .07);
        float a = pow(vUv.y, 1.6) * smoothstep(0., .25, vUv.x) * smoothstep(1., .75, vUv.x) * streak * vF * uA;
        gl_FragColor = vec4(uC * a, 1.);
      }`
  }));
}

/* ---------- reactor core ---------- */
function makeCore(scale) {
  const g = new THREE.Group();
  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(80, 1),
    new THREE.MeshStandardMaterial({ color: 0xc8d4dc, metalness: 1, roughness: .22, flatShading: true, envMap: envTex, envMapIntensity: 1.2 }));
  const cage = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(82, 1)), new THREE.LineBasicMaterial({ color: new THREE.Color(1.4, 1.9, 2.2) }));
  const heart = new THREE.Mesh(new THREE.SphereGeometry(38, 32, 16), glowMat([2.4, 3.4, 4.2]));
  const rings = [118, 140, 162].map((r, i) => {
    const m = new THREE.Mesh(new THREE.TorusGeometry(r, 1.1 + i * .4, 8, 200), glowMat([1.6 + i * .3, 2.4, 2.9]));
    m.rotation.x = Math.PI / 2 + (i - 1) * .45; return m;
  });
  g.add(shell, cage, heart, new THREE.PointLight(0x9fdcff, 3, 700, 1.2), ...rings);
  g.userData = { shell, cage, heart, rings };
  g.scale.setScalar(scale);
  return g;
}
function spinCore(core, t, baseY) {
  const d = core.userData;
  d.shell.rotation.set(t * .15, t * .22, 0); d.cage.rotation.copy(d.shell.rotation);
  d.heart.scale.setScalar(1 + Math.sin(t * 2.2) * .04);
  d.rings.forEach((r, i) => { r.rotation.z = t * (.18 + i * .12) * (i % 2 ? -1 : 1); });
  core.position.y = baseY + Math.sin(t * .8) * 4;
}

/* ---------- keyframe helper ---------- */
const sm = k => k * k * (3 - 2 * k);
const lerp = (a, b, k) => a + (b - a) * k;
function camAt(KF, u) {
  if (u <= KF[0].u) return KF[0];
  for (let i = 0; i < KF.length - 1; i++) {
    const a = KF[i], b = KF[i + 1];
    if (u <= b.u) { const k = sm((u - a.u) / (b.u - a.u || 1)); return { p: a.p.map((v, j) => lerp(v, b.p[j], k)), l: a.l.map((v, j) => lerp(v, b.l[j], k)) }; }
  }
  return KF[KF.length - 1];
}

/* ---------- post: bloom → VHS tape (with channel-change static) ---------- */
const rt = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
const renderPass = new RenderPass(SCENES[0].scene, camera);
composer.addPass(renderPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .5, .7, 1.05);
composer.addPass(bloom);
const tape = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uStatic: { value: 0 }, uSpeed: { value: 0 }, uExposure: { value: 1. }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uStatic, uSpeed, uExposure; uniform vec2 uRes; varying vec2 vUv;
    float h12(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    vec3 aces(vec3 x){ return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }
    vec3 tone(vec2 uv){ return pow(aces(texture2D(tDiffuse, uv).rgb * uExposure), vec3(1. / 2.2)); }
    float luma(vec3 c){ return dot(c, vec3(.299, .587, .114)); }
    void main(){
      vec2 p = vUv * 2. - 1.;
      vec2 q = p * (1. + .11 * dot(p, p)) * .955;
      vec2 uv = q * .5 + .5;
      vec2 eq = abs(q);
      float mask = (1. - smoothstep(.975, 1., eq.x)) * (1. - smoothstep(.975, 1., eq.y));
      vec2 px = 1. / uRes;
      float line = floor(uv.y * uRes.y / 2.);
      uv.y = fract(uv.y + uStatic * uStatic * .6 * fract(uTime * 1.3));             // vertical roll while tuning
      uv.x += sin(uv.y * 9. + uTime * 1.1) * .0007 + (h12(vec2(line, floor(uTime * 24.))) - .5) * (.0007 + uStatic * .02);
      float spd = clamp(abs(uSpeed), 0., 1.);
      // fast-forward / rewind: the picture slips and tears into horizontal bands
      float ffy = fract(uv.y * 3. + uTime * (uSpeed > 0. ? -2.3 : 2.3));
      float ffBand = smoothstep(.0, .05, ffy) * (1. - smoothstep(.05, .16, ffy)) * spd;
      uv.x += ffBand * (h12(vec2(line, floor(uTime * 30.))) - .3) * .06 + spd * sin(uv.y * 40. + uTime * 30.) * .002;
      // a tracking-error band that rolls up the screen every ~11 s
      float tc = fract(uTime / 11.), ty = 1.15 - tc * 1.5, trk = smoothstep(.045, .0, abs(uv.y - ty)) * step(tc, .8);
      uv.x += trk * (h12(vec2(line, floor(uTime * 20.))) - .5) * .018;
      float band = smoothstep(.07, .0, uv.y);
      uv.x += band * (h12(vec2(floor(uv.y * 140.), floor(uTime * 22.))) - .5) * .035;

      vec3 c0 = tone(uv);
      vec3 cb = (tone(uv + vec2(px.x * 2., 0.)) + tone(uv - vec2(px.x * 2., 0.)) + tone(uv + vec2(0., px.y * 1.5)) + tone(uv - vec2(0., px.y * 1.5))) * .25;
      float Y = luma(mix(c0, cb, .5));
      Y += (Y - luma(cb)) * 1.1;
      vec3 cs = vec3(0.);
      for (int i = 0; i < 6; i++) cs += tone(uv - vec2(px.x * (float(i) * 3. + 3.), 0.));
      cs /= 6.;
      float I = dot(cs, vec3(.596, -.274, -.322)), Qc = dot(cs, vec3(.211, -.523, .312));
      vec3 col = vec3(Y + .956 * I + .621 * Qc, Y - .272 * I - .647 * Qc, Y - 1.106 * I + 1.703 * Qc);
      float l = clamp(Y, 0., 1.2);
      vec3 graded = mix(vec3(.012, .03, .055), vec3(.2, .4, .56), smoothstep(.0, .55, l));
      graded = mix(graded, vec3(.8, .93, 1.), smoothstep(.5, 1.05, l));
      col = mix(graded, col * vec3(.82, .96, 1.12), .24);
      // signal ghost (echo a few pixels to the right) — the classic over-the-air smear
      col += (luma(tone(uv - vec2(px.x * 14., 0.))) - Y) * vec3(.09, .1, .12);
      float ca = .0028 * dot(p, p) + uStatic * .01 + spd * .006;
      col.r += (luma(tone(uv + p * ca)) - Y) * .35;
      col.b += (luma(tone(uv - p * ca)) - Y) * .35;

      float ln = floor(gl_FragCoord.y / 2.), tk = floor(uTime * 15.);
      float has = step(.9968 - uStatic * .04, h12(vec2(ln, tk)));
      float sx = h12(vec2(ln, tk + 3.)) * uRes.x, sl = 12. + h12(vec2(ln, tk + 7.)) * 60.;
      col = mix(col, vec3(.92, .97, 1.), has * step(sx, gl_FragCoord.x) * step(gl_FragCoord.x, sx + sl) * .8);
      col = mix(col, vec3(.85, .92, 1.), band * h12(vec2(gl_FragCoord.x * .3, floor(uTime * 30.) + line)) * .35);

      // channel change: snow + a rolling bright bar
      float snow = h12(floor(gl_FragCoord.xy / 1.5) + fract(uTime * 61.) * vec2(91., 57.));
      col = mix(col, vec3(snow) * vec3(.78, .9, 1.), smoothstep(.05, .85, uStatic));
      float r = fract(vUv.y * .7 + uTime * .8);
      col += smoothstep(0., .06, r) * (1. - smoothstep(.06, .14, r)) * uStatic * .28;

      // noise inside the tracking band and FF bars
      float bn = h12(vec2(gl_FragCoord.x * .2, line + floor(uTime * 40.)));
      col = mix(col, vec3(.85, .93, 1.) * bn, trk * .28 + ffBand * .55);
      col *= 1. - ffBand * .25;
      // aperture-grille phosphor mask + interlace + mains flicker
      float m3 = mod(gl_FragCoord.x, 3.);
      col *= mix(vec3(1.), vec3(m3 < 1. ? 1.08 : .94, m3 >= 1. && m3 < 2. ? 1.08 : .94, m3 >= 2. ? 1.08 : .94), .55);
      col *= 1. - .035 * step(.5, fract((gl_FragCoord.y + floor(uTime * 30.)) * .5));
      col *= 1. + .018 * sin(uTime * 377.) + .012 * sin(uTime * 2.1);
      col *= .91 + .09 * sin(gl_FragCoord.y * 3.14159);
      col += (h12(gl_FragCoord.xy * .73 + fract(uTime * 7.) * 113.) - .5) * .065;
      col *= smoothstep(1.5, .42, length(p * vec2(.9, 1.)));
      col *= mask;
      gl_FragColor = vec4(col, 1.);
    }`
});
composer.addPass(tape);

/* ---------- resize ---------- */
let W, H, DPR;
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  composer.setPixelRatio(DPR); composer.setSize(W, H);
  bloom.resolution.set(W * DPR / 2, H * DPR / 2);
  tape.uniforms.uRes.value.set(W * DPR, H * DPR);
  camera.aspect = W / H; camera.fov = W < 768 ? 70 : 58; camera.updateProjectionMatrix();
}
resize(); addEventListener('resize', resize);

/* ---------- channel OSD ---------- */
const CH_NAMES = ['CANYON', 'ARCHIVE', 'ROOFTOPS', 'SIGNAL'];
const osd = document.getElementById('chosd');
let curScene = -1, osdTimer;
function showOSD(i) {
  osd.innerHTML = `<b>CH ${String(i + 1).padStart(2, '0')}</b> ${CH_NAMES[i]}`;
  osd.classList.add('on'); clearTimeout(osdTimer);
  osdTimer = setTimeout(() => osd.classList.remove('on'), 2200);
}

/* ---------- loop ---------- */
let mx = 0, my = 0, tmx = 0, tmy = 0, prevT = performance.now(), fpsS = 60, lastHud = 0;
const t0 = performance.now();
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { tmx = e.clientX / innerWidth - .5; tmy = e.clientY / innerHeight - .5; } });
const v3 = new THREE.Vector3();
const hudL = document.getElementById('hudL'), hudR = document.getElementById('hudR');
const fmt = (n, w = 6) => (n < 0 ? '-' : '+') + Math.abs(n).toFixed(1).padStart(w, '0');
const p2 = n => String(Math.floor(n)).padStart(2, '0');
const BOUNDS = [p0, aS, cS];
let prevU = 0, spdS = 0;
const stamp = document.getElementById('stamp');
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function tick(now) {
  requestAnimationFrame(tick);
  const t = reduce ? 0 : now * .001, dt = Math.max(.001, (now - prevT) / 1000); prevT = now;
  fpsS += (1 / dt - fpsS) * .05;
  const u = A.getU();
  const idx = u < p0 ? 0 : u < aS ? 1 : u < cS ? 2 : 3;
  const S = SCENES[idx];
  if (idx !== curScene) { curScene = idx; renderPass.scene = S.scene; if (now - t0 > 500) showOSD(idx); }

  // static peaks exactly at each scene boundary, so the cut happens inside the noise
  let st = 0;
  for (const b of BOUNDS) st = Math.max(st, 1 - sm(Math.min(1, Math.abs(u - b) / .16)));
  tape.uniforms.uStatic.value = st;
  const vel = (u - prevU) / dt; prevU = u;
  spdS += (Math.max(-1, Math.min(1, vel / 2.2)) - spdS) * Math.min(1, dt * 6);
  tape.uniforms.uSpeed.value = reduce ? 0 : (Math.abs(spdS) < .12 ? 0 : spdS);
  tape.uniforms.uTime.value = reduce ? 0 : t;

  const k = camAt(S.KF, u);
  const ease = 1 - Math.exp(-dt * 3);
  mx += (tmx - mx) * ease; my += (tmy - my) * ease;
  const breathe = reduce ? 0 : Math.sin(t * .35) * 2.5;                // a hand-held, barely-there drift
  camera.position.set(k.p[0] + mx * 16, k.p[1] - my * 12 + breathe, k.p[2]);
  camera.lookAt(k.l[0] + mx * 8, k.l[1] - my * 6, k.l[2]);
  S.at.uTime.value = t; S.at.uCam.value.copy(camera.position);
  S.tick(t, camera.position);

  if (idx === 1) screens.forEach((s, i) => {
    const p = C.projects[i];
    s.u.uTime.value = t; s.u.uSeed.value = i * 3 + p.variant * 7;
    const tex = p.textures && p.textures[p.variant];
    if (tex !== s.u.uTex.value) { s.u.uTex.value = tex || null; s.u.uFade.value = 0; }
    s.u.uHasTex.value = tex ? 1 : 0;
    if (tex) s.u.uTexAspect.value = tex.image.width / tex.image.height;
    s.u.uFade.value = Math.min(1, s.u.uFade.value + dt * 3);
  });

  composer.render(dt);

  screens.forEach((s, i) => {
    const el = A.labelEls[i];
    const dist = screenZ(i) - camera.position.z, prevDist = i > 0 ? screenZ(i - 1) - camera.position.z : -1;
    let a = idx === 1 && dist > 140 && dist < 1800 ? Math.min(1, (dist - 140) / 220) * Math.min(1, (1800 - dist) / 600) : 0;
    if (Math.abs(dist - 210) < 150 || prevDist > 120) a = 0;
    a *= 1 - st;
    v3.set(-SW / 2 - 4, SH / 2 + 12, 0).applyMatrix4(s.mesh.matrixWorld).project(camera);
    if (v3.z > 1 || a < .02) { el.style.visibility = 'hidden'; el.style.opacity = 0; return; }
    const x = (v3.x + 1) / 2 * W, y = (1 - v3.y) / 2 * H;
    el.style.visibility = 'visible'; el.style.opacity = a.toFixed(3);
    el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) translateY(-100%) scale(${Math.max(.55, Math.min(1.3, 600 / dist)).toFixed(3)})`;
  });

  if (now - lastHud > 90) {
    lastHud = now;
    hudL.textContent = `CH ${String(idx + 1).padStart(2, '0')}  ${CH_NAMES[idx]}\nPOS  X${fmt(camera.position.x, 5)}  Y${fmt(camera.position.y, 5)}  Z${fmt(camera.position.z, 6)}`;
    const e = (now - t0) / 1000, d = new Date(), hh = d.getHours();
    stamp.textContent = `${hh < 12 ? 'AM' : 'PM'} ${(hh % 12) || 12}:${p2(d.getMinutes())}\n${MON[d.getMonth()]}.${p2(d.getDate())} ${d.getFullYear()}`;
    const tr = spdS > .25 ? '<b>▶▶</b> FF  ' : spdS < -.25 ? '<b>◀◀</b> REW ' : '<b>▶</b> PLAY';
    hudR.innerHTML = `${tr}   SP   ${String(Math.round(fpsS)).padStart(3, '0')} FPS\nTC ${p2(e / 3600)}:${p2(e / 60 % 60)}:${p2(e % 60)}:${p2(e * 30 % 30)}`;
  }
}
SCENES.forEach(s => renderer.compile(s.scene, camera));
A.sceneReady();
requestAnimationFrame(tick);
</script>
</body>
</html>
